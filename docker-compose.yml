services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MCP_TOOLS_URL=http://mcp-tools:8080/mcp
    depends_on:
      - mcp-tools

  mcp-tools:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend